# Same shape as every other standalone here — see rtp-standalone's copy for why each line matters.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '26.3'
description: 'The Prime subscription: /prime, the store commands, and map art for members.'
author: Raindancer118
website: https://github.com/RaindanceMC/prime

# Map art is drawn on the global thread and handed over on the player's own.
folia-supported: true

dependencies:
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
