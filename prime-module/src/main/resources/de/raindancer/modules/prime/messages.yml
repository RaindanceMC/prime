# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
prime:
  overview:
    header: "<gradient:#ff3d9a:#ffd27a><bold>✦ Prime ✦</bold></gradient> <gray>— support the server, get a little shine"
    active: "<green>You have Prime</green> <gray>until <white><until></white> · since <white><since></white> · <white><months></white> month(s) of drops unlocked. Thank you!"
    perk-names: "<dark_gray> • <white>Coloured names</white> <gray>— gradients, decorations, presets in /cosmetics"
    perk-skins: "<dark_gray> • <white>Every weapon and armour skin</white> <gray>— plus particles and teleport looks"
    perk-drops: "<dark_gray> • <white>A Prime-only drop every month</white> <gray>— yours for each month you are Prime"
    perk-badge: "<dark_gray> • <white>The [PRIME] badge</white> <gray>in nine colours — /rank style"
    perk-guild: "<dark_gray> • <white>Guild colours from day one</white> <gray>— paint your guild's tag and name"
    perk-statue: "<dark_gray> • <white>Your statue at spawn</white> <gray>— among everybody who supports the server"
    perk-mapart: "<dark_gray> • <white>Any image as map art</white> <gray>— /prime mapart <link> <width>x<height>"
    perk-ideas: "<dark_gray> • <white>Your ideas first</white> <gray>— feature requests from /bugreport jump the queue"
    perk-role: "<dark_gray> • <white>The Prime role</white> <gray>here and on our Discord"
    mapart-left: "<gray>Map art left this month: <white><left></white>."
    store: "<button> <dark_gray>— <gray><url>"
    store-button: "<gradient:#ff3d9a:#ffd27a><bold>[ Get Prime ]</bold></gradient>"
    store-hover: "<gray>Open the store"
    not-prime: "<gray>You do not have Prime yet. Ask the team how to get it."
  mapart:
    usage: "<gray>/prime mapart <https-link> <width>x<height> <dark_gray>— e.g. <gray>/prime mapart https://example.com/cat.png 2x2 <dark_gray>(maps wide × maps high)"
    usage-staff: "<gray>/prime mapart list · approve <id> · refuse <id> [reason]"
    switched-off: "<red>Map art requests are switched off on this server."
    not-prime: "<red>Map art is a Prime perk. <gray>/prime shows what Prime gives."
    too-big: "<red>One image covers at most <white><most></white> maps."
    bad-link: "<red>That link will not do: <white><reason></white>. <gray>Use the image's own https:// address."
    month-used: "<red>You have used this month's map art (<white><allowed></white>). <gray>Next month brings another."
    not-saved: "<red>The request could not be saved right now. Try again in a moment."
    asked: "<green>Asked!</green> <gray>Map art <white><id></white> (<white><size></white> maps) waits for the team to look at it. Only send images you may use."
    staff-new: "<gradient:#ff3d9a:#ffd27a>Map art</gradient> <white><id></white> <gray>from <white><player></white>, <white><size></white> maps: <open> <click:run_command:'/prime mapart approve <id>'><green>[Approve]</green></click> <click:suggest_command:'/prime mapart refuse <id> '><red>[Refuse]</red></click>"
    open-image: "<aqua>[open the image]"
    none-waiting: "<gray>No map art waits for a look."
    unknown: "<red>There is no map art <white><id></white>."
    not-waiting: "<red>Map art <white><id></white> was decided already."
    fetching: "<gray>Fetching and drawing map art <white><id></white>…"
    failed: "<red>Map art <white><id></white> could not be drawn: <white><reason></white>. <gray>It still waits — refuse it, or ask the player for another link."
    approved-staff: "<green>Map art <white><id></white> is drawn. <gray><player> gets the maps now, or when they next join."
    refused-staff: "<yellow>Map art <white><id></white> by <white><player></white> is refused; it does not count against their month."
    refused: "<yellow>Your map art <white><id></white> was refused: <white><reason></white>. <gray>It does not count — try another image."
    delivered: "<green>Your map art <white><id></white> is here: <white><count></white> map(s), <white><size></white>. <gray>Put them in item frames row by row, top left first."
    delivered-dropped: "<green>Your map art <white><id></white> is here: <white><count></white> map(s), <white><size></white>. <yellow>Your inventory was full, so some are on the ground at your feet."
    item: "<gradient:#ff3d9a:#ffd27a>Map art <id></gradient> <gray>— column <column>, row <row>"
